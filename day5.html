<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <style>
    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>
  
  <form id="calcForm">
    <input type="text" id="num1" placeholder="Enter first number">
    <span id="error1" class="error"></span><br><br>
    
    <input type="text" id="num2" placeholder="Enter second number">
    <span id="error2" class="error"></span><br><br>
    
    <button type="button" onclick="calculate('add')">Add</button>
    <button type="button" onclick="calculate('subtract')">Subtract</button>
    <button type="button" onclick="calculate('multiply')">Multiply</button>
    <button type="button" onclick="calculate('divide')">Divide</button>
  </form>
  
  <h3>Result: <span id="result"></span></h3>
  
  <script>
    function calculate(operation) {
      // Clear previous errors
      document.getElementById("error1").innerText = "";
      document.getElementById("error2").innerText = "";
      
      let num1 = document.getElementById("num1").value;
      let num2 = document.getElementById("num2").value;
      let valid = true;
      
      if (num1 === "") {
        document.getElementById("error1").innerText = "Please enter a number.";
        valid = false;
      }
      if (num2 === "") {
        document.getElementById("error2").innerText = "Please enter a number.";
        valid = false;
      }
      
      if (!valid) return;
      
      num1 = parseFloat(num1);
      num2 = parseFloat(num2);
      let result;
      
      switch(operation) {
        case 'add':
          result = num1 + num2;
          break;
        case 'subtract':
          result = num1 - num2;
          break;
        case 'multiply':
          result = num1 * num2;
          break;
        case 'divide':
          if (num2 === 0) {
            result = "Cannot divide by zero!";
          } else {
            result = num1 / num2;
          }
          break;
      }
      
      document.getElementById("result").innerText = result;
    }
  </script>
</body>
</html>
