<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .gallery {
        gap: 10px;
      }

      .gallery img {
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <h1>My Photo Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
    <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
    <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
    <img src="https://picsum.photos/id/1035/600/400" alt="River">
    <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
    <img src="https://picsum.photos/id/106/600/400" alt="Water">
    <img src="https://picsum.photos/id/1074/600/400" alt="Beach">
    <img src="https://picsum.photos/id/1084/600/400" alt="Landscape">
  </div>

</body>
</html>
